name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # Updates automatically every 12 hours
  workflow_dispatch: # Enables the manual "Run workflow" button

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Step 1: Safely load your repository files into the automation workspace
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      # Step 2: Generate the snake SVGs directly into an assets folder
      - name: Generate Snake Files
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Step 3: Commit and push the new files straight to your main branch
      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          mkdir -p assets
          git add assets/
          git commit -m "chore: update snake animation" || exit 0
          git push
